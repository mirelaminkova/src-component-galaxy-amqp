---
name: Molecule tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  molecule:
    runs-on: ubuntu-latest
    env:
      ANSIBLE_FORCE_COLOR: '1'
      # The community.general 'yaml' stdout callback was removed in community.general 12.
      ANSIBLE_CALLBACK_RESULT_FORMAT: yaml
      REQUIREMENTS_FILE: molecule/requirements.txt
      BOOTSTRAP_KEY: foobar  # defines an api bootstrap key for the molecule tests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -r ${{ env.REQUIREMENTS_FILE }}
      - name: Molecule tests
        run: |
          BOOTSTRAP_KEY=${{ env.BOOTSTRAP_KEY }} molecule -vvv test --all
