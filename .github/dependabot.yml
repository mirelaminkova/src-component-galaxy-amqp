---
# Dependabot version updates; see
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# A cooldown delays updates to freshly published (possibly malicious) versions.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: ".github/"  # Galaxy version tracker, see .github/workflows/requirements.txt
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "pip"
    directory: "/"  # requirements-dev.txt (test and lint tooling)
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"  # keeps the SHA-pinned actions current
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
