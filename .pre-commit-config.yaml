---
# Install both hook types: pre-commit install --hook-type pre-commit --hook-type pre-push
# Run everything:          pre-commit run --all-files
#                          pre-commit run --hook-stage pre-push --all-files
# Versions of the local Python hooks match requirements-dev.txt; keep them in sync.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
exclude: ^molecule/_testfiles/  # fixtures, kept byte-for-byte

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Local instead of the upstream hook: ansible-lint installs requirements.yml
      # (git clones). git exports GIT_INDEX_FILE to hooks, and an inherited value
      # makes those clones overwrite this repository's index during `git commit`.
      - id: ansible-lint
        name: ansible-lint
        entry: env -u GIT_INDEX_FILE -u GIT_DIR -u GIT_WORK_TREE ansible-lint
        language: python
        additional_dependencies: [ansible-lint==26.11.0]
        files: \.(ya?ml|j2)$
        pass_filenames: false

      - id: pytest
        name: pytest (unit + template tests, 100% coverage)
        entry: pytest
        language: python
        additional_dependencies:
          - pytest==9.2.0
          - pytest-cov==7.1.0
          - Jinja2==3.1.6
          - PyYAML==6.0.3
          - ansible-core==2.21.6
          # TPV and Galaxy 26.0, as in requirements-dev.txt
          - total-perspective-vortex==3.1.3
          - galaxy-app==26.0.2
          - galaxy-auth==26.0.2
          - galaxy-config==26.0.2
          - galaxy-data==26.0.2
          - galaxy-files==26.0.2
          - galaxy-job-execution==26.0.2
          - galaxy-job-metrics==26.0.2
          - galaxy-navigation==26.0.2
          - galaxy-objectstore==26.0.2
          - galaxy-schema==26.0.2
          - galaxy-tool-shed-schema==26.0.2
          - galaxy-tool-util==26.0.2
          - galaxy-tool-util-models==26.0.2
          - galaxy-tours==26.0.2
          - galaxy-util==26.0.2
          - galaxy-web-framework==26.0.2
          - galaxy-web-stack==26.0.2
          - fissix==24.4.24
        files: ^(tests/|templates/|files/|vars/|filter_plugins/|pyproject\.toml$)
        pass_filenames: false

      - id: ast-grep-test
        name: ast-grep rule tests
        entry: ast-grep test --skip-snapshot-tests
        language: python
        additional_dependencies: [ast-grep-cli==0.51.1]
        files: ^(sgconfig\.yml$|ast-grep/)
        pass_filenames: false

      # pre-push: block the push on any finding.
      - id: semgrep
        name: semgrep (p/default, p/secrets)
        entry: semgrep scan --config p/default --config p/secrets --error --metrics=off --quiet
        language: python
        additional_dependencies: [semgrep==1.184.0]
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: ast-grep-scan
        name: ast-grep scan
        entry: ast-grep scan --error
        language: python
        additional_dependencies: [ast-grep-cli==0.51.1]
        pass_filenames: false
        always_run: true
        stages: [pre-push]
