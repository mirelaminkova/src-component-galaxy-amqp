---
- name: Install Galaxy Server
  hosts: "{{ lookup('env', 'variable_host') | default('localhost', true) }}" # workaround because SRC needs localhost, but molecule needs specifc hostvars

  pre_tasks:
    # Tagged always: CD runs (tasks/cd.yml, --tags _galaxy_cd_tags) need the variables and the
    # CO admin facts (galaxy.yml admin_users) too.
    - name: Set workspace user facts
      ansible.builtin.include_role:
        name: uusrc.general.fact_regular_users
        apply:
          tags: [always]
      tags: [always]

    - name: Include config tasks and load variables
      ansible.builtin.include_tasks:
        file: tasks/set_config.yml
        apply:
          tags: [always]
      tags: [always]

    # The EU-layout BYOC onboarding files: group_vars/mq.yml, secret_group_vars/*.yml (Vault),
    # templates/galaxy/config/job_conf.yml and files/galaxy/config/user_preferences_extra_conf.yml.
    # Loaded explicitly: SRC runs the playbook with `-i localhost,`, which skips group_vars/.
    # Tagged always: the CD job (issue #22) runs only some tags but needs these variables.
    - name: Load the BYOC onboarding files and secrets
      ansible.builtin.include_tasks:
        file: tasks/byoc_onboarding.yml
        apply:
          tags: always
      tags: always

    - name: Install Dependencies
      ansible.builtin.apt:
        update_cache: true
        name:
          - "git"
          - "python3-psycopg2"
          - "python3-virtualenv"
          - "python3-dev"
          - "gcc"
          - "acl"
          - "gnutls-bin" # workaround for git-clone issue, https://stackoverflow.com/a/53147659/4326632
        state: present

    - name: Install AppTainer
      ansible.builtin.include_tasks: tasks/apptainer.yml

    - name: Additional nginx config
      ansible.builtin.include_tasks: tasks/nginx.yml

    # Before the galaxyproject.galaxy role: job_conf.yml needs the RabbitMQ passwords
    # (_galaxy_rabbitmq_passwords) for the AMQP Pulsar runners, and the broker should be up
    # before Galaxy starts.
    - name: Install RabbitMQ for remote Pulsar servers (AMQPS)
      ansible.builtin.include_tasks:
        file: tasks/rabbitmq.yml
        apply:
          tags: [rabbitmq]
      tags: [rabbitmq]
      when: _galaxy_rabbitmq

  roles:
    - role: galaxyproject.cvmfs
      when: _galaxy_enable_cvmfs
    - role: geerlingguy.docker
      when: not _molecule_active and _galaxy_enable_docker
    - role: uusrc.general.nginx_location
      vars:
        nginx_location_locations: "{{ galaxy_nginx_vhost_config }}"
    - role: uusrc.general.nginx_reverse_proxy
      vars:
        nginx_reverse_proxy_locations: >-
          {{ galaxy_nginx_proxy_config +
            ( _galaxy_enable_tus | ternary(tusd_nginx_config, []) ) }}
    - role: galaxyproject.postgresql
    - role: galaxyproject.postgresql_objects
      become: true
      become_user: postgres
    - role: galaxyproject.galaxy
      vars:
        galaxy_config: "{{ _galaxy_config }}"
    - role: galaxyproject.tusd
      when: _galaxy_enable_tus

  tasks:
    - name: Ensure Galaxy storage has correct permissions
      when: src_galaxy_storage_path is defined and src_galaxy_storage_path | length > 0
      become: true
      ansible.builtin.file:
        path: "{{ galaxy_mutable_data_dir }}"
        state: directory
        owner: "{{ galaxy_user }}"
        group: "{{ galaxy_group }}"
        mode: "0755"
        recurse: true

    - name: Lock down nginx config for www-data # so non-root users cannot read the GX_SECRET
      ansible.builtin.file:
        state: directory
        owner: root
        group: www-data
        mode: "0750"
        path: /etc/nginx/app-location-conf.d
        recurse: true

    - name: Copy default tool config
      tags: molecule-idempotence-notest
      ansible.builtin.copy:
        remote_src: true
        src: "{{ galaxy_server_dir }}/config/tool_conf.xml.sample"
        dest: "{{ galaxy_config_dir }}/tool_conf.xml"
        owner: "{{ galaxy_privsep_user }}"
        group: "{{ galaxy_user }}"
        mode: "0644"

    - name: Install the prebuilt Galaxy client (Galaxy 26.1+)
      ansible.builtin.include_tasks: tasks/web_client.yml
      when: _galaxy_web_client_wheel

    - name: Enable interactive tools
      ansible.builtin.include_tasks: tasks/interactive_tools.yml
      when: _galaxy_use_interactive_tools

    # Job routing is done by TPV (files/galaxy/tpv/) since issue #20; remove the Python
    # dynamic rule earlier versions of this playbook installed.
    - name: Remove the old default_dispatcher job rule
      ansible.builtin.file:
        path: "{{ galaxy_server_dir }}/lib/galaxy/jobs/rules/default_dispatcher.py"
        state: absent

    - name: Add nginx user to galaxy group
      ansible.builtin.user:
        name: www-data
        groups: "{{ galaxy_user }}"
        append: true
      notify: restart nginx

    - name: Create welcome page
      ansible.builtin.template:
        src: welcome.html.j2
        dest: "{{ galaxy_server_dir }}/static/welcome.html"
        owner: "{{ galaxy_privsep_user }}"
        group: "{{ galaxy_user }}"
        mode: "644"

    - name: Populate service facts
      ansible.builtin.service_facts:

    # This is to ensure that the Collaborative Organisation admin group can use sudo on the machine,
    # allowing us to disable the ResearchCloud co_passwordless_sudo parameter,
    # which grants passwordless sudo to *all* CO users on the machine.
    - name: Add CO admin group to sudoers
      ansible.builtin.copy:
        dest: /etc/sudoers.d/co_admins
        owner: "root"
        group: "root"
        mode: "0644"
        content: "%{{ _galaxy_admin_co_group }} ALL=(ALL:ALL) ALL"

    - name: Ensure services enabled and started
      when: "(not item == 'galaxy-tusd.service') or _galaxy_enable_tus"
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      with_items:
        - galaxy-tusd.service
        - galaxy.target

    - name: Run bootstrap
      when: _galaxy_do_bootstrap
      block:
        - name: Include tasks to bootstrap the instance
          ansible.builtin.include_tasks: tasks/bootstrap.yml

      always:
        - name: Remove bootstrap API key from Galaxy config
          when: _galaxy_bootstrap_api_key is defined
          ansible.builtin.lineinfile:
            path: "{{ galaxy_config_dir }}/galaxy.yml"
            regexp: ".*bootstrap_admin_api_key:"
            state: absent
          notify: galaxy gravity restart

  post_tasks:
    # Last, so the timer never starts before the deployment is done. Untagged: not part of CD runs.
    - name: Set up continuous deployment (ansible-pull timer)
      ansible.builtin.include_tasks: tasks/cd.yml
      when: _galaxy_cd

  handlers:
    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
      listen: restart nginx

    - name: Galaxy gravity restart
      ansible.builtin.command: "/usr/local/bin/galaxyctl graceful"
      listen: "restart galaxy"
      when: _galaxy_already_started is not defined
