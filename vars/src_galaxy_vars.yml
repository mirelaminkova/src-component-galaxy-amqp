---
# Variables derived from component parameters in ResearchCLoud

_galaxy_job_destinations: # valid job destinations
  - docker
  - singularity
  - local
_galaxy_bootstrap: "{{ _molecule_idempotence | ternary(false, src_galaxy_bootstrap | default(false, true) | bool) }}"
_galaxy_ibridges_enabled: "{{ src_ibridges | default(true, true) | bool }}"
_galaxy_default_tool_files:
  - path: tools/ibridges.yml
    enabled: "{{ _galaxy_ibridges_enabled }}"
_galaxy_default_tool_files_list: "{{ _galaxy_default_tool_files | selectattr('enabled') | map(attribute='path') | list }}"
_galaxy_admin_co_group: "{{ src_galaxy_co_admin_group | default('src_co_admin', true) }}"
_galaxy_custom_repo: "{{ src_galaxy_custom_repo | default('') }}"
_galaxy_custom_repo_branch: "{{ src_galaxy_custom_repo_branch | default('main', true) }}"
# Unset or '' -> true; `default(true, true)` would also turn a boolean false into true (issue #32).
_galaxy_api_exposed: >-
  {{ true if src_galaxy_api_exposed | default('') | string | trim == '' else src_galaxy_api_exposed | bool }}
_galaxy_use_interactive_tools: "{{ src_galaxy_interactive_tools | default(false, true) | bool }}"
_galaxy_server_fqdn: "{{ workspace_fqdn | default('localhost', true) }}"
_galaxy_jobs_fallback: singularity
_galaxy_jobs_default: >-
  {{ (src_galaxy_jobs_default is not defined or src_galaxy_jobs_default not in _galaxy_job_destinations)
  | ternary(_galaxy_jobs_fallback, src_galaxy_jobs_default) }}
_galaxy_enable_docker: "{{ _galaxy_use_interactive_tools or (_galaxy_jobs_default == 'docker') }}"
_galaxy_enable_tus: "{{ src_galaxy_enable_tus | default(true, true) | bool }}"
_galaxy_enable_cvmfs: "{{ _molecule_active | ternary(false, src_galaxy_cvmfs | default(true, true) | bool) }}"
_galaxy_brand: "{{ src_galaxy_brand | default('SURF ResearchCloud', true) }}"
_galaxy_rabbitmq: "{{ src_galaxy_rabbitmq | default(false, true) | bool }}"
_galaxy_rabbitmq_port: "{{ src_galaxy_rabbitmq_port | default(5671, true) | int }}"

# Build the final lists of tool and workflow installation files

_galaxy_tool_files: "{{ src_galaxy_tool_files | default('', true) | split(',') | select() + _galaxy_default_tool_files_list }}"
_galaxy_workflow_files: "{{ src_galaxy_workflow_files | default('') | split(',') | select() }}"

_galaxy_pulsar_configs_input: "{{ src_galaxy_pulsar_configs | default('', true) }}"
_galaxy_pulsar_tool_mappings_input: "{{ src_galaxy_pulsar_tool_mappings | default('', true) }}"

# Parse the Pulsar parameters. SRC passes them as strings in a relaxed YAML flow style
# (e.g. "[{name: hpc, url: https://...}]"); the src_config_list filter
# (filter_plugins/src_galaxy.py) turns them into lists of dicts and fails on malformed input.
_galaxy_pulsar_configs_raw: "{{ _galaxy_pulsar_configs_input | src_config_list('src_galaxy_pulsar_configs') }}"
_galaxy_pulsar_tool_mappings: "{{ _galaxy_pulsar_tool_mappings_input | src_config_list('src_galaxy_pulsar_tool_mappings') }}"

# Remote Pulsars connected over AMQP (PulsarMQJobRunner, issue #4). Entries are validated in
# tasks/set_config.yml (_galaxy_pulsar_amqp_config_errors must be empty); _galaxy_pulsar_amqp_configs
# adds defaults and the derived vhost (/pulsar/<name>), runner (pulsar_mq_<name>) and
# environment (amqp_<name>) names.
_galaxy_pulsar_amqp_configs_list: >-
  {{ src_galaxy_pulsar_amqp_configs | default('', true) | src_config_list('src_galaxy_pulsar_amqp_configs') }}
_galaxy_pulsar_amqp_config_errors: "{{ _galaxy_pulsar_amqp_configs_list | pulsar_amqp_config_errors }}"
_galaxy_pulsar_amqp_configs: "{{ _galaxy_pulsar_amqp_configs_list | pulsar_amqp_configs }}"

# Check if there are  pulsar configs
_galaxy_has_pulsar: "{{ (_galaxy_pulsar_configs_raw | length > 0) | bool }}"
# Note that some component parameters are also used in galaxy_vars.yml:
# src_galaxy_storage_path
# src_galaxy_version
# Galaxy 26.1+ ships its prebuilt client as the galaxy-web-client wheel, which the
# galaxyproject.galaxy role cannot install yet; tasks/web_client.yml does it instead.
_galaxy_web_client_wheel: "{{ src_galaxy_version | default('26.1', true) is version('26.1', '>=') }}"

# --- Pulsar user preferences and TPV job routing (issues #5, #20) ---
# Remote destinations users can pick under "Use distributed compute resources".
# id: the TPV destination files/galaxy/tpv/destinations.yml.j2 writes (`remote_<name>_basic`
# for REST Pulsars, keep the name logic in sync; `amqp_<name>` for AMQP ones);
# tag: the `<name>-pulsar` scheduling tag that destination requires, which is the value the
# dropdown stores (usegalaxy.eu convention); label: the config's `label` key, or the host of
# its URL (REST) or its name (AMQP).
_galaxy_remote_destinations: >-
  {%- set ns = namespace(destinations=[]) -%}
  {%- for pulsar in _galaxy_pulsar_configs_raw -%}
    {%- set name = pulsar.name | default(pulsar.url | replace('https://', '') | replace('http://', '') | replace('.', '-') | replace('/', '-')) -%}
    {%- set host = pulsar.url | regex_replace('^[a-zA-Z][a-zA-Z0-9+.-]*://', '') | regex_replace('[/:].*$', '') -%}
    {%- set ns.destinations = ns.destinations + [{'id': 'remote_' ~ name ~ '_basic', 'label': pulsar.label | default(host, true), 'tag': name ~ '-pulsar'}] -%}
  {%- endfor -%}
  {%- for pulsar in _galaxy_pulsar_amqp_configs -%}
    {%- set ns.destinations = ns.destinations + [{'id': pulsar.environment, 'label': pulsar.label, 'tag': pulsar.name ~ '-pulsar'}] -%}
  {%- endfor -%}
  {{ ns.destinations }}
# The scheduling tag of every destination a tool mapping (src_galaxy_pulsar_tool_mappings
# `environment`) may name: the local ones, the remote ones above and the Docker variant
# (`remote_<name>`) of REST Pulsars with docker_enabled.
_galaxy_tpv_destination_tags: >-
  {%- set ns = namespace(tags={'local': 'local', 'docker': 'docker', 'singularity': 'singularity'}) -%}
  {%- for destination in _galaxy_remote_destinations -%}
    {%- set ns.tags = ns.tags | combine({destination.id: destination.tag}) -%}
  {%- endfor -%}
  {%- for pulsar in _galaxy_pulsar_configs_raw if pulsar.docker_enabled | default(false) | bool -%}
    {%- set name = pulsar.name | default(pulsar.url | replace('https://', '') | replace('http://', '') | replace('.', '-') | replace('/', '-')) -%}
    {%- set ns.tags = ns.tags | combine({'remote_' ~ name: name ~ '-pulsar-docker'}) -%}
  {%- endfor -%}
  {{ ns.tags }}
# Tool mappings apply only when there is a remote Pulsar (as before TPV); each gets the tag
# of its destination (unknown environments are reported by _galaxy_tpv_config_errors).
_galaxy_tpv_tool_mappings: >-
  {%- set ns = namespace(mappings=[]) -%}
  {%- for mapping in (_galaxy_pulsar_tool_mappings if _galaxy_remote_destinations | length > 0 else []) -%}
    {%- if mapping.environment | default('') in _galaxy_tpv_destination_tags and mapping.tool_id is defined -%}
      {%- set ns.mappings = ns.mappings + [mapping | combine({'tag': _galaxy_tpv_destination_tags[mapping.environment]})] -%}
    {%- endif -%}
  {%- endfor -%}
  {{ ns.mappings }}
# Checked in tasks/set_config.yml: two remote Pulsars with one tag, or a tool mapping to an
# unknown destination, would route jobs to the wrong place.
_galaxy_tpv_config_errors: >-
  {%- set ns = namespace(errors=[]) -%}
  {%- set tags = _galaxy_remote_destinations | map(attribute='tag') | list -%}
  {%- for tag in tags | unique if tags | select('equalto', tag) | list | length > 1 -%}
    {%- set error = 'Pulsar tag ' ~ tag ~ ' is used by more than one of src_galaxy_pulsar_configs /' -%}
    {%- set ns.errors = ns.errors + [error ~ ' src_galaxy_pulsar_amqp_configs (names must differ)'] -%}
  {%- endfor -%}
  {%- for mapping in (_galaxy_pulsar_tool_mappings if _galaxy_remote_destinations | length > 0 else []) -%}
    {%- if mapping.tool_id is not defined -%}
      {%- set ns.errors = ns.errors + ['src_galaxy_pulsar_tool_mappings entry ' ~ (mapping | to_json) ~ ' has no tool_id'] -%}
    {%- elif mapping.environment | default('') not in _galaxy_tpv_destination_tags -%}
      {%- set error = 'src_galaxy_pulsar_tool_mappings: ' ~ mapping.tool_id ~ ' maps to unknown environment ' -%}
      {%- set known = ' (known: ' ~ (_galaxy_tpv_destination_tags | list | join(', ')) ~ ')' -%}
      {%- set ns.errors = ns.errors + [error ~ (mapping.environment | default('') | to_json) ~ known] -%}
    {%- endif -%}
  {%- endfor -%}
  {{ ns.errors }}
# Experimental "bring your own Pulsar" preference form (backend: issue #6).
_galaxy_byoc_pulsar: "{{ src_galaxy_byoc_pulsar | default(false, true) | bool }}"
