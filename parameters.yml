---
# You can use this file to pass in parameters when testing the playbook locally, with something like:
# ansible-playbook -i localhost, -c local -e "@parameters.yml" -vv galaxysrv.yml
# Note: define booleans as strings to simulare behavior on ResearchCloud.
src_galaxy_bootstrap: 'false'
src_galaxy_interactive_tools: 'false'
workspace_fqdn: set_to_your_fqdn
src_galaxy_cvmfs: 'true'
src_galaxy_jobs_default: singularity
src_galaxy_byoc_pulsar: 'false'
src_galaxy_rabbitmq: 'false'
# Remote Pulsars over AMQP (needs src_galaxy_rabbitmq: 'true'), same format as src_galaxy_pulsar_configs, e.g.
# src_galaxy_pulsar_amqp_configs: "[{name: hpc, label: Our HPC cluster, docker_enabled: true}]"
src_galaxy_pulsar_amqp_configs: ''
# Secret parameter: Ansible Vault password of secret_group_vars/*.yml (BYOC onboarding, issue #21).
# Needed only when secret_group_vars/ holds files and src_galaxy_rabbitmq is 'true'.
src_galaxy_vault_password: ''
# Continuous deployment with an ansible-pull timer (see README, "Continuous deployment").
src_galaxy_cd: 'false'
src_galaxy_cd_branch: main
src_galaxy_cd_interval: '15'
