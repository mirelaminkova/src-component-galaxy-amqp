---
driver:
  name: podman
  image_settings: &image_settings
    # Public image on ghcr.io: no registry login needed.
    pre_build_image: true
platforms:
  - name: workspace-src-ubuntu_jammy
    image: ghcr.io/utrechtuniversity/src-test-workspace:ubuntu_jammy-nginx
    <<: *image_settings
    command: /sbin/init
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    published_ports:
      - 80/tcp
provisioner:
  name: ansible
  config_options:
    defaults:
      remote_tmp: /tmp
  env:
    variable_host: all
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # - idempotence # disabling idempotence because the remote_user_secret option is not idempotent
    - verify
    - cleanup
    - destroy
