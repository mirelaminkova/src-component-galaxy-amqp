---
- name: Verify
  hosts: all
  gather_facts: false

  tasks:
    - name: Make sure Galaxy API is up
      ansible.builtin.uri:
        url: "http://localhost:8080/api/version"
      register: galaxy_service_live
      until: "galaxy_service_live.status == 200"
      retries: 10
      delay: 10 # check every 10 seconds for a maximum of 5 minutes

    - name: Test reverse proxy without auth
      ansible.builtin.command: curl --fail-with-body http://localhost:80/
      changed_when: false
      failed_when: false
      register: galaxy_service_live

    - name: Get GX_SECRET
      ansible.builtin.shell: grep -r GX_SECRET /etc/nginx | rev | cut -f 1 -d " " | rev | cut -f1 -d ";"
      register: gx_secret

    - name: Test Galaxy with auth and secret
      ansible.builtin.uri:
        url: http://localhost:8080/
        headers:
          REMOTE_USER: testuser
          GX_SECRET: "{{ gx_secret.stdout }}"

    - name: Assertions
      ansible.builtin.assert:
        that:
          - "'Access to Galaxy is denied' in galaxy_service_live.stdout" # this sentence is displayed by Galaxy if the GX_SECRET header is not passed along

    # --- Issue #5: Pulsar user preferences and preference-based job routing ---
    - name: Read the extra user preferences and job config
      ansible.builtin.slurp:
        src: "/srv/galaxy/config/{{ item }}"
      loop:
        - user_preferences_extra_conf.yml
        - job_conf.yml
      register: issue5_config_files

    - name: Check the default_dispatcher job rule is installed
      ansible.builtin.stat:
        path: /srv/galaxy/server/lib/galaxy/jobs/rules/default_dispatcher.py
      register: issue5_rule

    - name: Assert preferences and job routing are configured
      vars:
        issue5_prefs: "{{ (issue5_config_files.results[0].content | b64decode | from_yaml).preferences }}"
        issue5_job_conf: "{{ issue5_config_files.results[1].content | b64decode | from_yaml }}"
      ansible.builtin.assert:
        that:
          - "'irods_config' in issue5_prefs"
          - "'byoc_pulsar' in issue5_prefs"
          - "['Molecule Pulsar', 'remote_molecule_basic'] in issue5_prefs.distributed_compute.inputs[0].options"
          - issue5_job_conf.execution.default == 'default_dispatcher'
          - "'remote_molecule_basic' in issue5_job_conf.execution.environments"
          - issue5_rule.stat.exists

    - name: Get the current Galaxy user
      ansible.builtin.uri:
        url: http://localhost:8080/api/users/current
        headers: &issue5_headers
          REMOTE_USER: testuser
          GX_SECRET: "{{ gx_secret.stdout }}"
      register: issue5_user

    - name: Save a distributed_compute preference through the Galaxy API
      ansible.builtin.uri:
        url: "http://localhost:8080/api/users/{{ issue5_user.json.id }}/information/inputs"
        method: PUT
        body_format: json
        body:
          "distributed_compute|remote_resources": remote_molecule_basic
        headers: *issue5_headers

    - name: Read the user's preference forms back from the Galaxy API
      ansible.builtin.uri:
        url: "http://localhost:8080/api/users/{{ issue5_user.json.id }}/information/inputs"
        headers: *issue5_headers
      register: issue5_info

    - name: Assert Galaxy serves the forms and stored the choice
      vars:
        issue5_sections: "{{ issue5_info.json.inputs | selectattr('type', 'equalto', 'section') | list }}"
        issue5_compute: "{{ issue5_sections | selectattr('name', 'equalto', 'distributed_compute') | first }}"
      ansible.builtin.assert:
        that:
          - "'byoc_pulsar' in (issue5_sections | map(attribute='name'))"
          - issue5_compute.inputs[0].value == 'remote_molecule_basic'

    # --- RabbitMQ (src_galaxy_rabbitmq: 'true' in converge.yml) ---

    - name: Get RabbitMQ service state
      ansible.builtin.command: systemctl is-active rabbitmq-server
      changed_when: false
      register: rabbitmq_active

    - name: Get RabbitMQ and Erlang versions
      ansible.builtin.shell: >-
        set -o pipefail &&
        dpkg-query -W -f '${Package} ${Version}\n' rabbitmq-server erlang-base
      args:
        executable: /bin/bash
      changed_when: false
      register: rabbitmq_versions

    - name: Show RabbitMQ and Erlang versions
      ansible.builtin.debug:
        var: rabbitmq_versions.stdout_lines

    - name: Get listening TCP sockets
      ansible.builtin.command: ss -Hltn
      changed_when: false
      register: listening

    - name: Get RabbitMQ users
      ansible.builtin.command: rabbitmqctl list_users --silent
      changed_when: false
      register: rabbitmq_users

    - name: Get explicitly enabled RabbitMQ plugins
      ansible.builtin.command: rabbitmq-plugins list --enabled --minimal --silent
      changed_when: false
      register: rabbitmq_plugins

    - name: Stat RabbitMQ secrets and TLS files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/galaxy-rabbitmq
        - /etc/galaxy-rabbitmq/galaxy.pass
        - /etc/rabbitmq/tls/key.pem
        - /etc/ssl/acme/localhost/key.pem
      register: rabbitmq_files

    - name: Authenticate the galaxy user with its stored password
      ansible.builtin.shell: rabbitmqctl authenticate_user galaxy "$(cat /etc/galaxy-rabbitmq/galaxy.pass)"
      changed_when: false
      no_log: true

    - name: TLS handshake on the AMQPS port
      ansible.builtin.shell: openssl s_client -connect 127.0.0.1:5671 -servername localhost </dev/null
      changed_when: false
      register: amqps_handshake

    - name: RabbitMQ assertions
      vars:
        sockets: "{{ listening.stdout_lines | map('split') | map(attribute=3) | list }}"
        amqp_sockets: "{{ sockets | select('match', '.*:5672$') | list }}"
        dist_sockets: "{{ sockets | select('match', '.*:(4369|25672)$') | list }}"
        users: "{{ rabbitmq_users.stdout_lines | map('split') | map('first') | list }}"
        files: "{{ rabbitmq_files.results | items2dict(key_name='item', value_name='stat') }}"
      ansible.builtin.assert:
        that:
          - rabbitmq_active.stdout == 'active'
          - amqp_sockets | length > 0
          - amqp_sockets | reject('match', '^127\.0\.0\.1:') | list == []
          - dist_sockets | reject('match', '^(127\.0\.0\.1|\[::1\]):') | list == []
          - sockets | select('match', '.*:5671$') | list | length > 0
          - sockets | select('match', '.*:15672$') | list == []
          - "'guest' not in users"
          - "'galaxy' in users"
          - "'rabbitmq_management' not in rabbitmq_plugins.stdout_lines"
          - files['/etc/galaxy-rabbitmq'].mode == '0700'
          - files['/etc/galaxy-rabbitmq'].pw_name == 'root'
          - files['/etc/galaxy-rabbitmq/galaxy.pass'].mode == '0600'
          - files['/etc/galaxy-rabbitmq/galaxy.pass'].pw_name == 'root'
          - files['/etc/rabbitmq/tls/key.pem'].mode == '0640'
          - files['/etc/rabbitmq/tls/key.pem'].pw_name == 'root'
          - files['/etc/rabbitmq/tls/key.pem'].gr_name == 'rabbitmq'
          - files['/etc/ssl/acme/localhost/key.pem'].mode == '0600'
          - files['/etc/ssl/acme/localhost/key.pem'].gr_name == 'root'
          - "'BEGIN CERTIFICATE' in amqps_handshake.stdout"
