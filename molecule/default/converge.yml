---
- name: Converge
  hosts: all
  gather_facts: false

- name: Run playbook as test
  ansible.builtin.import_playbook: ../../galaxysrv.yml
  vars:
    src_galaxy_tool_files: "{{ playbook_dir ~ '/molecule/_testfiles/tool_list.yaml.sample' }}"
    src_galaxy_workflow_files: "{{ playbook_dir ~ '/molecule/_testfiles/sample-workflow.ga' }}"
    src_ibridges: 'true'
    workspace_fqdn: localhost
    # Issue #5: a (never contacted) Pulsar destination and the BYOC form, so verify.yml
    # can check the distributed_compute/byoc_pulsar preferences and the job rule.
    src_galaxy_pulsar_configs: "[{name: molecule, label: Molecule Pulsar, url: https://pulsar.invalid, private_token: not-a-secret}]"
    src_galaxy_byoc_pulsar: 'true'
    src_galaxy_rabbitmq: 'true'
    # Issue #4: one AMQP Pulsar (no Pulsar connects); creates vhost /pulsar/molecule-mq and its user.
    src_galaxy_pulsar_amqp_configs: "[{name: molecule-mq, label: Molecule AMQP Pulsar}]"
