# Tool configuration only: this repository is an Ansible playbook, not a Python package.

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--cov",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true
# What is measured: the playbook's filter plugins, the test helper package and the Python
# modules rendered from repo templates (e.g. templates/default_dispatch.py.j2 -> tests/rendered/).
source_dirs = ["filter_plugins", "tests/helpers", "tests/rendered"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "PT", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest tests are written
"tests/**" = ["S101"]
