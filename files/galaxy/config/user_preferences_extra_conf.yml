---
# BYOC onboarding file in the usegalaxy.eu infrastructure-playbook layout (issue #21).
# An onboarding pull request appends one option ["<label>", <tag>] to remote_resources below.
# The playbook adds these options to the "Use distributed compute resources" select of
# templates/galaxy/config/user_preferences_extra_conf.yml.j2 (after the Pulsars configured
# through the component parameters); the other keys are not used. <tag> is the tag a TPV
# destination in files/galaxy/tpv/destinations.yml.j2 requires.
# See README.md, "Onboarding a BYOC Pulsar via PR".
preferences:
    distributed_compute:
        description: Use distributed compute resources
        inputs:
            - name: remote_resources
              label: Remote resources id
              type: select
              required: false
              options:
                  - ["default - Galaxy will decide where to put your job", None]
